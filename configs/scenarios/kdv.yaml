# informative metric here than nRMSE.
name: diff_kdv
# apebench.scenarios.difficulty.scenario_dict["diff_kdv"]  (class: KortewegDeVries)
difficulty_params:
  kdv_gamma: -8.0
  kdv_delta: -10.0
